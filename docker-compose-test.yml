version: '3.8'

services:
  app:
    container_name: pretix_app
    image: pretix/standalone:stable
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
    environment:
      - CELERY_BROKER_URL=redis://cache:6379/2
      - CELERY_RESULT_BACKEND=redis://cache:6379/1
      - PRETIX_INSTANCE_NAME=My Pretix Installation
      - PRETIX_URL=http://localhost:8000
      - PRETIX_CURRENCY=EUR
      - PRETIX_DATADIR=/data
      - PRETIX_DATABASE_BACKEND=postgresql
      - PRETIX_DATABASE_NAME=pretix
      - PRETIX_DATABASE_USER=pretix
      - PRETIX_DATABASE_PASSWORD=pretix
      - PRETIX_DATABASE_HOST=database
      - PRETIX_REDIS_LOCATION=redis://cache/0
      - PRETIX_REDIS_SESSIONS=true
    ports:
      - "8000:80"
    networks:
      - backend

  database:
    image: postgres:17-alpine3.22
    container_name: database
    environment:
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=pretix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine3.22
    container_name: redis
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  pretix_data:
    driver: local

networks:
  backend:
    driver: bridge