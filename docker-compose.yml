
services:
  app:
    container_name: pretix_app
    image: pretix/standalone:stable
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
    environment:
      - CELERY_BROKER_URL=redis://cache:6379/2
      - CELERY_RESULT_BACKEND=redis://cache:6379/1
      - PRETIX_URL=https://v1.tickets.kulturleben-berlin.de
    command: ["pretix", "web"]
    networks:
      - backend

  worker:
    container_name: pretix_worker
    image: pretix/standalone:stable
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
    environment:
      - CELERY_BROKER_URL=redis://cache:6379/2
      - CELERY_RESULT_BACKEND=redis://cache:6379/1
      - PRETIX_URL=https://v1.tickets.kulturleben-berlin.de
    command: ["pretix", "worker"]
    networks:
      - backend

  database:
    image: postgres:17-alpine3.22
    container_name: database
    environment:
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=pretix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine3.22
    container_name: redis
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  pretix_data:
    driver: local

networks:
  backend:
    driver: bridge