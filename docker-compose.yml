
services:
  app:
    container_name: pretix_app
    image: pretix/standalone:stable
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
      - ./docker/pretix/pretix-simple.cfg:/etc/pretix/pretix.cfg:ro
    environment:
      - CELERY_BROKER_URL=redis://cache:6379/2
      - CELERY_RESULT_BACKEND=redis://cache:6379/1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend

  database:
    image: postgres:17-alpine3.22
    container_name: database
    environment:
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=pretix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine3.22
    container_name: redis
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  pretix_data:
    driver: local

networks:
  backend:
    driver: bridge