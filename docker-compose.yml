version: '3'
services:
  app:
    container_name: pretix_app
    build:
      dockerfile: Dockerfile
      context: ./docker/pretix
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
      - ./docker/pretix/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_LOCATION=${REDIS_LOCATION}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_FROM=${MAIL_FROM}
    networks:
      - backend

  database:
    image: postgres:17-alpine3.22
    container_name: database
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-pretix}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pretix}
      - POSTGRES_DB=${DB_NAME:-pretix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine3.22
    container_name: redis
    ports:
      - "6379:6379"
    env_file:
      - .env
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  pretix_data:
    driver: local

networks:
  backend:
    driver: bridge
    # Let Coolify/Traefik handle host binding and TLS. Removed host binding option.
