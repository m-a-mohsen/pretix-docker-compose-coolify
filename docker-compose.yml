version: '3.8'

services:
  app:
    image: pretix/standalone:stable
    container_name: pretix_app
    restart: always
    depends_on:
      - database
      - cache
    environment:
      - PRETIX_DATABASE_HOST=database
      - PRETIX_DATABASE_NAME=pretix
      - PRETIX_DATABASE_USER=pretix
      - PRETIX_DATABASE_PASSWORD=pretix
      - PRETIX_REDIS=redis://cache:6379/0
      - PRETIX_EMAIL_FROM=admin@example.com
      - PRETIX_URL=https://pretix.example.com
    volumes:
      # Persistent Pretix data
      - pretix_data:/data

      # Pretix configuration file (must exist)
      - ./pretix.cfg:/etc/pretix/pretix.cfg:ro

      # Cron definition — FILE, not directory
      - ./crontab:/tmp/crontab:ro

      # Optional Nginx configuration (if using internal nginx)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "81:80"
      - "444:443"
    networks:
      - backend

  database:
    image: postgres:17-alpine3.22
    container_name: pretix_db
    environment:
      - POSTGRES_USER=pretix
      - POSTGRES_PASSWORD=pretix
      - POSTGRES_DB=pretix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine3.22
    container_name: pretix_redis
    restart: always
    networks:
      - backend

volumes:
  pretix_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/coolify/applications/${APP_ID}/pretix_data

  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/coolify/applications/${APP_ID}/postgres_data

networks:
  backend:
    driver: bridge
