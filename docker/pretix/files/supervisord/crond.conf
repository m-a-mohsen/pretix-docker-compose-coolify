[program:crond]
# Execute the cron runner from the runtime cron directory and use the crontab
# located inside the same directory. The ENV_... substitution expects an
# environment variable named IMAGE_CRON_DIR to be exported by the container
# (supervisord exposes env vars as %(ENV_<NAME>)s).
command = %(ENV_IMAGE_CRON_DIR)s/cron.py --crontab %(ENV_IMAGE_CRON_DIR)s/crontab --loglevel INFO --logfile /var/log/crond.log
autostart = true
redirect_stderr = true
stdout_logfile = /var/log/crond.log
stdout_logfile_maxbytes = 1MB
stdout_logfile_backups = 2