[pretix]
instance_name=My Pretix Installation
url=https://v1.tickets.kulturleben-berlin.de
currency=EUR
datadir=/data
trust_x_forwarded_for=on
trust_x_forwarded_proto=on
registration=off

[locale]
default=de
timezone=Europe/Berlin

[database]
backend=postgresql
name=pretix
user=pretix
password=pretix
host=database

[redis]
location=redis://cache/0
sessions=true

[celery]
backend=redis://cache/1
broker=redis://cache/2